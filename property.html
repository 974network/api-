<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>عقار للإيجار</title>
  <meta property="og:title" content="عقار للإيجار">
  <meta property="og:description" content="اطلع على تفاصيل العقار">
  <meta name="theme-color" content="#1a1a2e">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { background: var(--surface-2); }

    /* Share page header */
    .client-page { max-width: 700px; margin: 0 auto; }

    .share-header {
      background: linear-gradient(135deg, #1a1a2e 0%, #0f3460 100%);
      padding: 2rem 1.5rem 1.5rem;
      text-align: center;
      color: #fff;
      border-radius: 0 0 var(--radius-xl) var(--radius-xl);
      margin-bottom: 1.5rem;
    }
    .share-header .brand {
      font-size: 12px; letter-spacing: 2px; text-transform: uppercase;
      opacity: 0.6; margin-bottom: 0.75rem;
    }
    .share-header .property-title-h {
      font-size: 26px; font-weight: 900; line-height: 1.2;
      margin-bottom: 8px;
    }
    .share-header .property-id-label {
      display: inline-block;
      background: rgba(226,160,74,0.2);
      border: 1px solid rgba(226,160,74,0.4);
      color: var(--accent-light);
      padding: 4px 16px; border-radius: 20px;
      font-size: 13px; font-weight: 600;
    }

    .price-block {
      background: var(--accent);
      border-radius: var(--radius-xl);
      padding: 1.5rem;
      text-align: center;
      margin: 0 1rem 1.5rem;
      box-shadow: 0 8px 30px rgba(226,160,74,0.3);
    }
    .price-block .label { font-size: 12px; color: rgba(26,26,46,0.65); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
    .price-block .price { font-size: 48px; font-weight: 900; color: var(--primary); line-height: 1; margin: 4px 0; }
    .price-block .unit  { font-size: 14px; color: rgba(26,26,46,0.6); }

    .section-card {
      background: var(--surface);
      border-radius: var(--radius-xl);
      padding: 1.5rem;
      margin: 0 1rem 1.25rem;
      border: 1px solid var(--border);
    }
    .section-card h3 {
      font-size: 14px; font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase; letter-spacing: 1px;
      margin-bottom: 1rem;
    }

    .contact-card {
      background: var(--primary);
      border-radius: var(--radius-xl);
      padding: 1.5rem;
      margin: 0 1rem 1.25rem;
      display: flex; flex-direction: column; gap: 10px;
    }
    .contact-card h3 { color: rgba(255,255,255,0.7); font-size: 13px; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 4px; }
    .contact-btn {
      display: flex; align-items: center; gap: 12px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      color: #fff;
      padding: 12px 18px;
      border-radius: var(--radius-md);
      font-family: var(--font-ar); font-size: 15px; font-weight: 600;
      cursor: pointer; text-decoration: none;
      transition: background 0.2s;
    }
    .contact-btn:hover { background: rgba(255,255,255,0.14); }
    .contact-btn .icon { font-size: 22px; }
    .contact-btn.whatsapp { background: rgba(37,211,102,0.15); border-color: rgba(37,211,102,0.3); color: #25d366; }
    .contact-btn.whatsapp:hover { background: rgba(37,211,102,0.25); }

    .footer-note {
      text-align: center; padding: 2rem 1rem;
      font-size: 12px; color: var(--text-muted);
    }

    .status-pill {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 16px; border-radius: 20px;
      font-size: 13px; font-weight: 700;
      margin-bottom: 12px;
    }
    .status-available { background: rgba(46,125,50,0.15); color: #2e7d32; }
    .status-rented    { background: rgba(198,40,40,0.15); color: #c62828; }
    .status-reserved  { background: rgba(230,81,0,0.15);  color: #e65100; }

    .gallery-wrap { margin: 0 1rem 1.25rem; }

    @media (max-width: 480px) {
      .section-card, .contact-card, .price-block, .gallery-wrap { margin-left: 0.75rem; margin-right: 0.75rem; }
    }
  </style>
</head>
<body>

<div id="loadingScreen" class="loading-screen" style="min-height:100vh;">
  <div class="spinner"></div>
  <span>جار تحميل تفاصيل العقار...</span>
</div>

<div id="errorScreen" style="display:none;" class="empty-state" style="min-height:100vh;">
  <div class="empty-icon">😕</div>
  <h3>العقار غير موجود</h3>
  <p>تحقق من الرابط أو تواصل مع المكتب</p>
</div>

<div id="mainContent" style="display:none;" class="client-page">

  <!-- Header -->
  <div class="share-header">
    <div class="brand" id="siteBrand">عقاراتنا</div>
    <div class="property-title-h" id="propTitle">—</div>
    <div class="status-pill" id="propStatusPill"></div>
    <br>
    <div class="property-id-label" id="propIdLabel"></div>
  </div>

  <!-- Price -->
  <div class="price-block">
    <div class="label">الإيجار الشهري</div>
    <div class="price" id="propPrice">—</div>
    <div class="unit">ريال قطري / شهرياً</div>
  </div>

  <!-- Gallery -->
  <div class="gallery-wrap">
    <div id="galleryContainer"></div>
  </div>

  <!-- Specs -->
  <div class="section-card">
    <h3>📋 تفاصيل الوحدة</h3>
    <div class="spec-grid" id="specsGrid"></div>
  </div>

  <!-- Notes -->
  <div class="section-card" id="notesCard" style="display:none;">
    <h3>📝 ملاحظات</h3>
    <p id="notesText" style="font-size:15px;color:var(--text-secondary);line-height:1.7;"></p>
  </div>

  <!-- Contact -->
  <div class="contact-card" id="contactCard" style="display:none;">
    <h3>📞 التواصل</h3>
    <div id="contactButtons"></div>
  </div>

  <!-- Share strip -->
  <div class="section-card" style="text-align:center;">
    <h3 style="margin-bottom:0.75rem;">مشاركة هذا العقار</h3>
    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
      <button class="btn btn-primary" onclick="sharePage()">📤 مشاركة الرابط</button>
      <button class="btn btn-outline" onclick="copyLink()">📋 نسخ الرابط</button>
    </div>
    <div id="linkBox" style="margin-top:12px;font-size:12px;color:var(--text-muted);word-break:break-all;"></div>
  </div>

  <div class="footer-note" id="footerNote">
    عقاراتنا — نظام إدارة عقارات
  </div>

</div>

<!-- Toast -->
<div class="toast-container" id="toastContainer"></div>

<!-- Scripts -->
<script src="config.js"></script>
<script src="js/app.js"></script>
<script>
  async function init() {
    const id = APP.getParam('id');
    if (!id) { showError(); return; }

    try {
      const data = await APP.API.get('getProperty', { id });
      if (!data.success || !data.property) { showError(); return; }
      renderProperty(data.property);
    } catch (err) {
      showError();
    }
  }

  function renderProperty(p) {
    // meta
    document.title = `${p.type} — ${p.location} | عقاراتنا`;

    // header
    document.getElementById('siteBrand').textContent   = CONFIG.SITE_NAME;
    document.getElementById('propTitle').textContent   = `${APP.propertyTypeIcon(p.type)} ${p.type} — ${p.location}`;
    document.getElementById('propIdLabel').textContent = `# ${p.id}`;
    document.getElementById('propPrice').textContent   = APP.formatPrice(p.rent);

    // status pill
    const pill = document.getElementById('propStatusPill');
    const cls  = { 'متاح': 'available', 'مؤجر': 'rented', 'محجوز': 'reserved' };
    pill.className = `status-pill status-${cls[p.status] || 'available'}`;
    pill.innerHTML = `<span>${p.status || 'متاح'}</span>`;

    // gallery
    const images = APP.getAllImages(p.images);
    if (images.length) {
      new APP.Gallery(images, 'galleryContainer');
    }

    // specs
    const specs = [
      { label: 'النوع',       value: p.type },
      { label: 'الموقع',      value: p.location },
      { label: 'الحالة',      value: p.status || 'متاح' },
      { label: 'الإيجار',     value: APP.formatPrice(p.rent) + ' ريال' },
      { label: 'الدور',       value: p.floor || '—' },
      { label: 'مفروشة',      value: p.furnished || 'لا' },
      { label: 'موقف سيارة', value: p.parking || '—' },
    ];
    document.getElementById('specsGrid').innerHTML = specs.map(s => `
      <div class="spec-item">
        <div class="spec-label">${s.label}</div>
        <div class="spec-value">${s.value || '—'}</div>
      </div>`).join('');

    // notes
    if (p.notes) {
      document.getElementById('notesText').textContent = p.notes;
      document.getElementById('notesCard').style.display = '';
    }

    // contact buttons (show office number, not owner number directly)
    const btns = [];
    if (CONFIG.WHATSAPP_NUMBER) {
      const msg = encodeURIComponent(`مرحباً، أنا مهتم بالعقار ${p.id} — ${p.type} في ${p.location}، الإيجار ${APP.formatPrice(p.rent)} ريال`);
      btns.push(`<a class="contact-btn whatsapp" href="https://wa.me/${CONFIG.WHATSAPP_NUMBER}?text=${msg}" target="_blank"><span class="icon">💬</span><span>تواصل عبر واتساب</span></a>`);
      btns.push(`<a class="contact-btn" href="tel:+${CONFIG.WHATSAPP_NUMBER}"><span class="icon">📞</span><span>اتصل بنا</span></a>`);
    }
    if (btns.length) {
      document.getElementById('contactButtons').innerHTML = btns.join('');
      document.getElementById('contactCard').style.display = '';
    }

    // link
    document.getElementById('linkBox').textContent = window.location.href;
    document.getElementById('footerNote').textContent = CONFIG.SITE_NAME + ' — نظام إدارة عقارات';

    // show page
    document.getElementById('loadingScreen').style.display = 'none';
    document.getElementById('mainContent').style.display   = '';
  }

  function showError() {
    document.getElementById('loadingScreen').style.display = 'none';
    document.getElementById('errorScreen').style.display   = '';
  }

  function sharePage() {
    const url  = window.location.href;
    const text = `🏠 عقار للإيجار\n${document.getElementById('propTitle')?.textContent || ''}\n${url}`;
    if (navigator.share) { navigator.share({ title: 'عقار للإيجار', text, url }); return; }
    const wa = `https://wa.me/?text=${encodeURIComponent(text)}`;
    window.open(wa, '_blank');
  }

  function copyLink() {
    navigator.clipboard.writeText(window.location.href).then(() => {
      APP.showToast('تم نسخ الرابط ✔', 'success');
    });
  }

  init();
</script>
</body>
</html>
