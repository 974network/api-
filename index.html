<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة الإدارة — عقاراتنا</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* ---- Page-specific ---- */
    .fab {
      position: fixed;
      bottom: 2rem; left: 2rem;
      width: 56px; height: 56px;
      background: var(--accent);
      color: var(--primary);
      border-radius: 50%;
      font-size: 26px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: var(--shadow-lg);
      z-index: 50;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .fab:hover { transform: scale(1.1); box-shadow: 0 10px 40px rgba(226,160,74,0.4); }

    .results-count {
      font-size: 13px;
      color: var(--text-muted);
      padding: 0 2px;
      align-self: center;
    }
  </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar">
  <div class="navbar-brand">
    <div class="logo-icon">🏠</div>
    <span>عقاراتنا — الإدارة</span>
  </div>
  <div class="navbar-actions">
    <span class="nav-badge" id="totalBadge">جار التحميل...</span>
    <a href="property.html" target="_blank" class="btn btn-outline btn-sm" style="color:rgba(255,255,255,0.8);border-color:rgba(255,255,255,0.2);">🔗 صفحة العميل</a>
  </div>
</nav>

<!-- Page -->
<div class="page-wrapper">

  <!-- Stats -->
  <div class="stats-bar" id="statsBar">
    <div class="stat-chip">
      <div class="stat-icon" style="background:var(--success-bg);color:var(--success);">✅</div>
      <div><div class="stat-value" id="countAvailable">—</div><div class="stat-label">متاح</div></div>
    </div>
    <div class="stat-chip">
      <div class="stat-icon" style="background:var(--danger-bg);color:var(--danger);">🔑</div>
      <div><div class="stat-value" id="countRented">—</div><div class="stat-label">مؤجر</div></div>
    </div>
    <div class="stat-chip">
      <div class="stat-icon" style="background:var(--warning-bg);color:var(--warning);">⏳</div>
      <div><div class="stat-value" id="countReserved">—</div><div class="stat-label">محجوز</div></div>
    </div>
    <div class="stat-chip">
      <div class="stat-icon" style="background:#e8eaf6;color:#3949ab;">🏢</div>
      <div><div class="stat-value" id="countTotal">—</div><div class="stat-label">الإجمالي</div></div>
    </div>
  </div>

  <!-- Header -->
  <div class="page-header">
    <div>
      <div class="page-title">العقارات المعروضة</div>
      <div class="page-subtitle">إدارة وعرض جميع العقارات</div>
    </div>
    <button class="btn btn-primary" onclick="openAddModal()">➕ إضافة عقار</button>
  </div>

  <!-- Filters -->
  <div class="filters-bar">
    <div class="search-bar">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="ابحث بالمعرّف، الموقع، النوع..." oninput="applyFilters()">
    </div>
    <div class="filter-group">
      <span class="filter-label">النوع</span>
      <select class="filter-control" id="filterType" onchange="applyFilters()">
        <option value="all">الكل</option>
        <option value="STUDIO">استديو</option>
        <option value="1BHK">1BHK</option>
        <option value="2BHK">2BHK</option>
        <option value="3BHK">3BHK</option>
        <option value="4BHK">4BHK</option>
        <option value="ROOM">غرفة</option>
        <option value="VILLA">فيلا</option>
      </select>
    </div>
    <div class="filter-group">
      <span class="filter-label">الحالة</span>
      <select class="filter-control" id="filterStatus" onchange="applyFilters()">
        <option value="all">الكل</option>
        <option value="متاح">متاح</option>
        <option value="محجوز">محجوز</option>
        <option value="مؤجر">مؤجر</option>
      </select>
    </div>
    <div class="filter-group">
      <span class="filter-label">أقصى سعر (ريال)</span>
      <input type="number" class="filter-control" id="filterPrice" placeholder="مثال: 5000" oninput="applyFilters()" style="min-width:130px;">
    </div>
    <span class="results-count" id="resultsCount"></span>
  </div>

  <!-- Grid -->
  <div id="propertiesGrid" class="properties-grid">
    <div class="loading-screen" style="grid-column:1/-1;">
      <div class="spinner"></div>
      <span>جار تحميل البيانات...</span>
    </div>
  </div>

</div>

<!-- FAB -->
<button class="fab" onclick="openAddModal()" title="إضافة عقار">＋</button>

<!-- Toast -->
<div class="toast-container" id="toastContainer"></div>

<!-- ===================== ADD/EDIT MODAL ===================== -->
<div class="modal-overlay" id="formModal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">إضافة عقار جديد</div>
      <button class="btn btn-ghost btn-icon" onclick="closeModal('formModal')">✕</button>
    </div>
    <div class="modal-body">
      <form id="propertyForm" onsubmit="submitProperty(event)">
        <input type="hidden" id="fieldId">
        <div class="form-grid">

          <div class="form-group">
            <label class="form-label">نوع الوحدة <span class="required">*</span></label>
            <select class="form-control" id="fieldType" required>
              <option value="">اختر النوع</option>
              <option value="STUDIO">استديو</option>
              <option value="1BHK">1BHK — غرفة وصالة</option>
              <option value="2BHK">2BHK — غرفتين وصالة</option>
              <option value="3BHK">3BHK — 3 غرف وصالة</option>
              <option value="4BHK">4BHK — 4 غرف وصالة</option>
              <option value="ROOM">غرفة مستقلة</option>
              <option value="VILLA">فيلا</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">الحالة <span class="required">*</span></label>
            <select class="form-control" id="fieldStatus" required>
              <option value="متاح">متاح</option>
              <option value="محجوز">محجوز</option>
              <option value="مؤجر">مؤجر</option>
            </select>
          </div>

          <div class="form-group full">
            <label class="form-label">الموقع / المنطقة <span class="required">*</span></label>
            <input type="text" class="form-control" id="fieldLocation" placeholder="مثال: العزيزية، الدوحة" required>
          </div>

          <div class="form-group">
            <label class="form-label">الإيجار الشهري (ريال) <span class="required">*</span></label>
            <input type="number" class="form-control" id="fieldRent" placeholder="مثال: 3500" required min="0">
          </div>

          <div class="form-group">
            <label class="form-label">الدور</label>
            <input type="text" class="form-control" id="fieldFloor" placeholder="مثال: الثالث">
          </div>

          <div class="form-group">
            <label class="form-label">مفروشة؟</label>
            <select class="form-control" id="fieldFurnished">
              <option value="لا">غير مفروشة</option>
              <option value="نعم">مفروشة</option>
              <option value="جزئي">مفروشة جزئياً</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">موقف سيارة</label>
            <input type="text" class="form-control" id="fieldParking" placeholder="مثال: موقف خاص">
          </div>

          <div class="form-group full">
            <label class="form-label">اسم المالك</label>
            <input type="text" class="form-control" id="fieldOwnerName" placeholder="اسم المالك">
          </div>

          <div class="form-group">
            <label class="form-label">رقم المالك</label>
            <input type="tel" class="form-control" id="fieldOwnerPhone" placeholder="974XXXXXXXX">
          </div>

          <div class="form-group">
            <label class="form-label">رقم واتساب المالك</label>
            <input type="tel" class="form-control" id="fieldOwnerWhatsapp" placeholder="974XXXXXXXX">
          </div>

          <div class="form-group full">
            <label class="form-label">روابط الصور (Google Drive)</label>
            <textarea class="form-control" id="fieldImages" rows="3" placeholder="الصق روابط Google Drive مفصولة بفاصلة&#10;مثال: https://drive.google.com/file/d/ID1/view, https://drive.google.com/file/d/ID2/view"></textarea>
            <span class="form-hint">💡 تأكد أن الصور مشاركة بشكل عام (Anyone with the link)</span>
          </div>

          <div class="form-group full">
            <label class="form-label">ملاحظات</label>
            <textarea class="form-control" id="fieldNotes" rows="2" placeholder="أي معلومات إضافية..."></textarea>
          </div>

        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('formModal')">إلغاء</button>
      <button class="btn btn-primary" id="submitBtn" onclick="submitProperty(event)">💾 حفظ العقار</button>
    </div>
  </div>
</div>

<!-- ===================== VIEW MODAL ===================== -->
<div class="modal-overlay" id="viewModal">
  <div class="modal" style="max-width:800px;">
    <div class="modal-header">
      <div class="modal-title" id="viewModalTitle">تفاصيل العقار</div>
      <button class="btn btn-ghost btn-icon" onclick="closeModal('viewModal')">✕</button>
    </div>
    <div class="modal-body" id="viewModalBody">
    </div>
  </div>
</div>

<!-- Scripts -->
<script src="config.js"></script>
<script src="app.js"></script>
<script>
  // =============================================
  //  Index Page Logic
  // =============================================
  let allProperties = [];

  // ---- Load ----
  async function loadProperties() {
    const grid = document.getElementById('propertiesGrid');
    try {
      const data = await APP.API.get('getProperties');
      if (!data.success) throw new Error(data.error || 'فشل التحميل');
      allProperties = data.properties || [];
      updateStats();
      renderGrid(allProperties);
    } catch (err) {
      console.error(err);
      grid.innerHTML = `
        <div class="empty-state" style="grid-column:1/-1;">
          <div class="empty-icon">⚠️</div>
          <h3>تعذّر تحميل البيانات</h3>
          <p>${err.message}</p>
          <br>
          <button class="btn btn-primary" onclick="loadProperties()">🔄 إعادة المحاولة</button>
        </div>`;
    }
  }

  function updateStats() {
    const avail    = allProperties.filter(p => p.status === 'متاح').length;
    const rented   = allProperties.filter(p => p.status === 'مؤجر').length;
    const reserved = allProperties.filter(p => p.status === 'محجوز').length;
    document.getElementById('countAvailable').textContent = avail;
    document.getElementById('countRented').textContent    = rented;
    document.getElementById('countReserved').textContent  = reserved;
    document.getElementById('countTotal').textContent     = allProperties.length;
    document.getElementById('totalBadge').textContent     = `${allProperties.length} عقار`;
  }

  function renderGrid(list) {
    const grid = document.getElementById('propertiesGrid');
    document.getElementById('resultsCount').textContent =
      list.length !== allProperties.length ? `${list.length} نتيجة` : '';
    if (!list.length) {
      grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;"><div class="empty-icon">🏠</div><h3>لا توجد عقارات</h3><p>أضف عقاراً جديداً للبدء</p></div>`;
      return;
    }
    grid.innerHTML = list.map(p => APP.buildPropertyCard(p)).join('');
  }

  // ---- Filters ----
  function applyFilters() {
    const filtered = APP.filterProperties(allProperties, {
      search:   document.getElementById('searchInput').value,
      type:     document.getElementById('filterType').value,
      status:   document.getElementById('filterStatus').value,
      maxPrice: document.getElementById('filterPrice').value,
    });
    renderGrid(filtered);
  }

  // ---- Modal ----
  function openAddModal() {
    document.getElementById('modalTitle').textContent = 'إضافة عقار جديد';
    document.getElementById('submitBtn').textContent  = '💾 حفظ العقار';
    document.getElementById('propertyForm').reset();
    document.getElementById('fieldId').value = '';
    openModal('formModal');
  }

  function editProperty(id) {
    const p = allProperties.find(x => x.id === id);
    if (!p) return;
    document.getElementById('modalTitle').textContent = `تعديل العقار — ${id}`;
    document.getElementById('submitBtn').textContent  = '✏️ حفظ التعديلات';
    document.getElementById('fieldId').value            = p.id;
    document.getElementById('fieldType').value          = p.type || '';
    document.getElementById('fieldStatus').value        = p.status || 'متاح';
    document.getElementById('fieldLocation').value      = p.location || '';
    document.getElementById('fieldRent').value          = p.rent || '';
    document.getElementById('fieldFloor').value         = p.floor || '';
    document.getElementById('fieldFurnished').value     = p.furnished || 'لا';
    document.getElementById('fieldParking').value       = p.parking || '';
    document.getElementById('fieldOwnerName').value     = p.ownerName || '';
    document.getElementById('fieldOwnerPhone').value    = p.ownerPhone || '';
    document.getElementById('fieldOwnerWhatsapp').value = p.ownerWhatsapp || '';
    document.getElementById('fieldImages').value        = p.images || '';
    document.getElementById('fieldNotes').value         = p.notes || '';
    openModal('formModal');
  }

  // ---- Submit ----
  async function submitProperty(e) {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = '⏳ جار الحفظ...';

    const id = document.getElementById('fieldId').value;
    const payload = {
      id,
      type:           document.getElementById('fieldType').value,
      status:         document.getElementById('fieldStatus').value,
      location:       document.getElementById('fieldLocation').value,
      rent:           document.getElementById('fieldRent').value,
      floor:          document.getElementById('fieldFloor').value,
      furnished:      document.getElementById('fieldFurnished').value,
      parking:        document.getElementById('fieldParking').value,
      ownerName:      document.getElementById('fieldOwnerName').value,
      ownerPhone:     document.getElementById('fieldOwnerPhone').value,
      ownerWhatsapp:  document.getElementById('fieldOwnerWhatsapp').value,
      images:         document.getElementById('fieldImages').value,
      notes:          document.getElementById('fieldNotes').value,
    };

    try {
      const action = id ? 'updateProperty' : 'addProperty';
      const res = await APP.API.post(action, payload);
      if (!res.success) throw new Error(res.error || 'فشلت العملية');
      APP.showToast(id ? 'تم تعديل العقار ✔' : 'تم إضافة العقار ✔', 'success');
      closeModal('formModal');
      loadProperties();
    } catch (err) {
      APP.showToast(`خطأ: ${err.message}`, 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = id ? '✏️ حفظ التعديلات' : '💾 حفظ العقار';
    }
  }

  // ---- Delete ----
  async function deleteProperty(id) {
    if (!confirm(`هل أنت متأكد من حذف العقار ${id}؟`)) return;
    try {
      const res = await APP.API.post('deleteProperty', { id });
      if (!res.success) throw new Error(res.error);
      APP.showToast('تم الحذف', 'success');
      loadProperties();
    } catch (err) {
      APP.showToast(`خطأ: ${err.message}`, 'error');
    }
  }

  // ---- View ----
  function openProperty(id) {
    const p = allProperties.find(x => x.id === id);
    if (!p) return;
    document.getElementById('viewModalTitle').textContent = `${APP.propertyTypeIcon(p.type)} ${p.type} — ${p.location}`;
    const images = APP.getAllImages(p.images);
    document.getElementById('viewModalBody').innerHTML = `
      <div id="propertyGallery" style="margin-bottom:1.5rem;"></div>
      <div class="spec-grid">
        <div class="spec-item"><div class="spec-label">المعرّف</div><div class="spec-value">${p.id}</div></div>
        <div class="spec-item"><div class="spec-label">الحالة</div><div class="spec-value">${p.status || '—'}</div></div>
        <div class="spec-item"><div class="spec-label">الموقع</div><div class="spec-value">${p.location || '—'}</div></div>
        <div class="spec-item"><div class="spec-label">الإيجار</div><div class="spec-value">${APP.formatPrice(p.rent)} ريال</div></div>
        <div class="spec-item"><div class="spec-label">الدور</div><div class="spec-value">${p.floor || '—'}</div></div>
        <div class="spec-item"><div class="spec-label">مفروشة</div><div class="spec-value">${p.furnished || 'لا'}</div></div>
        <div class="spec-item"><div class="spec-label">موقف</div><div class="spec-value">${p.parking || '—'}</div></div>
        <div class="spec-item"><div class="spec-label">المالك</div><div class="spec-value">${p.ownerName || '—'}</div></div>
        <div class="spec-item"><div class="spec-label">هاتف المالك</div><div class="spec-value">${p.ownerPhone || '—'}</div></div>
      </div>
      ${p.notes ? `<div style="margin-top:1rem;padding:1rem;background:var(--surface-2);border-radius:var(--radius-md);font-size:14px;color:var(--text-secondary);">📝 ${p.notes}</div>` : ''}
      <hr class="divider">
      <div style="display:flex;gap:10px;flex-wrap:wrap;">
        <button class="btn btn-primary" onclick="APP.shareProperty('${p.id}')">📤 مشاركة مع العميل</button>
        <a href="${CONFIG.SITE_URL}/property.html?id=${p.id}" target="_blank" class="btn btn-outline">🔗 فتح صفحة العميل</a>
        <button class="btn btn-outline" onclick="closeModal('viewModal');editProperty('${p.id}')">✏️ تعديل</button>
      </div>
    `;
    if (images.length) new APP.Gallery(images, 'propertyGallery');
    openModal('viewModal');
  }

  // ---- Modal Helpers ----
  function openModal(id)  { document.getElementById(id).classList.add('active'); }
  function closeModal(id) { document.getElementById(id).classList.remove('active'); }

  // Close on overlay click
  document.querySelectorAll('.modal-overlay').forEach(overlay => {
    overlay.addEventListener('click', e => {
      if (e.target === overlay) overlay.classList.remove('active');
    });
  });

  // ---- Init ----
  loadProperties();
</script>
</body>
</html>
